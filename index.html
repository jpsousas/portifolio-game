<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>João Pedro Sousa — Portfólio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2f38;
    --parchment:#f4ecd8;
    --parchment-edge:#d8c9a3;
    --slate:#5b6e8a;
    --slate-dark:#3d4c63;
    --leaf:#6f9b5e;
    --accent:#e0a458;
    --accent-dark:#b97f36;
    --sky-top:#bfe3f0;
    --sky-bottom:#e9f6ee;
    --cloud-opacity:1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --sky-top:#2b3350;
      --sky-bottom:#141826;
      --cloud-opacity:.7;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--sky-bottom);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
  }
  #sky-layer{
    position:fixed; inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
  }
  .sky-cloud{
    position:absolute;
    left:0; top:0;
    background-repeat:no-repeat;
    background-size:contain;
    image-rendering:pixelated;
    will-change:transform;
  }

  /* ---------- Bloqueio de orientação (retrato apenas) ---------- */
  #orientation-lock{
    display:none;
    position:fixed; inset:0;
    z-index:9999;
    background:var(--sky-bottom);
    color:var(--ink);
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  #orientation-lock__icon{
    font-size:52px;
    margin-bottom:18px;
    animation:rotate-hint 1.6s ease-in-out infinite;
  }
  @keyframes rotate-hint{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(90deg); }
  }
  #orientation-lock p{
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.7;
    max-width:280px;
  }
  #orientation-lock b{
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    display:inline-block;
    margin:0 2px;
  }
  @media (orientation: landscape) and (hover: none) and (pointer: coarse){
    #orientation-lock{ display:flex; }
  }

  /* ---------- Joystick virtual (mobile/touch) ---------- */
  #mobile-joystick{
    display:none;
    position:fixed;
    left:22px; bottom:22px;
    width:104px; height:104px;
    border-radius:50%;
    background:rgba(43,47,56,.35);
    border:2px solid rgba(255,255,255,.65);
    z-index:50;
    touch-action:none;
  }
  #mobile-joystick__knob{
    position:absolute;
    left:50%; top:50%;
    width:44px; height:44px;
    margin-left:-22px; margin-top:-22px;
    border-radius:50%;
    background:rgba(244,236,216,.92);
    border:2px solid var(--ink);
    box-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  @media (hover: none) and (pointer: coarse){
    #mobile-joystick{ display:block; }
  }

  #game-wrap{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%;
  }
  #game-container{
    /* wider container for tablet/desktop while keeping mobile responsive */
    width:min(100vw - 24px, 820px);
    height:min(calc((100vw - 24px) * 0.75), 615px);
    max-height:min(86vh, 615px);
    aspect-ratio:4 / 3;
    border:4px solid var(--ink);
    border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    image-rendering:pixelated;
    overflow:hidden;
  }
  #game-container canvas{ display:block; width:100%; height:100%; }

  @media (max-width: 768px){
    #hud{
      flex-direction:column;
      align-items:center;
      gap:8px;
    }
    #prompt-bubble{ display:none !important; }
    .hud-card{
      font-size:10px;
      padding:7px 10px;
      width:100%;
      text-align:center;
    }
    .hud-socials{
      align-items:center;
      text-align:center !important;
    }
    #footer-note{ font-size:9px; padding:0 12px; }
  }

  @media (max-width: 480px){
    #game-container{
      width:min(100vw - 16px, 420px);
      height:min(calc((100vw - 16px) * 0.8), 336px);
      max-height:72vh;
    }
    #hud{ top:8px; left:8px; right:8px; }
    .hud-card{ font-size:9px; line-height:1.45; padding:6px 8px; }
    .hud-title{ font-size:9px; }
    #footer-note{ bottom:8px; font-size:8.5px; }
    #modal-body .personal-slider{
      grid-template-columns:26px minmax(0, 1fr) 26px;
      column-gap:8px;
      padding:10px 8px 8px;
    }
    #modal-body .personal-card__frame{
      width:min(100%, 190px);
      aspect-ratio:4 / 5.2;
      padding:4px;
    }
    #modal-body .personal-card__copy,
    #modal-body .personal-slider__footer{
      display:none;
    }
    #modal-body .personal-slider__nav{
      width:26px;
      height:26px;
      font-size:9px;
    }
  }

  /* HUD */
  #hud{
    position:fixed; top:14px; left:14px; right:14px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    z-index:5;
  }
  .hud-card{
    background:rgba(244,236,216,.92);
    border:2px solid var(--ink);
    border-radius:8px;
    padding:8px 12px;
    font-size:11px;
    line-height:1.6;
    pointer-events:auto; /* allow interaction inside HUD cards */
    box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  .hud-help{
    animation:hud-help-fade .6s ease 8.5s forwards;
  }
  @keyframes hud-help-fade{
    to{
      opacity:0;
      visibility:hidden;
      transform:translateY(-4px);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .hud-help{ animation:none; }
  }
  .hud-socials{
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:flex-end;
    text-align:right;
  }
  .hud-contact{
    font-size:11px;
    line-height:1.4;
    color:var(--slate-dark);
    font-weight:700;
  }
  .social-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--slate-dark);
    text-decoration:none;
    font-weight:700;
  }
  .social-link img{
    width:18px;
    height:18px;
    image-rendering:pixelated;
    flex:0 0 auto;
  }
  .hud-title{
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    color:var(--slate-dark);
    margin-bottom:4px;
    display:block;
  }
  .key{
    display:inline-block;
    background:var(--slate);
    color:#fff;
    border-radius:3px;
    padding:1px 5px;
    margin:0 2px;
    font-family:'Press Start 2P', monospace;
    font-size:9px;
  }
.key-arrow{
  position: relative;
  width: 16px;
  height: 16px;
  display: inline-block;
  vertical-align: middle;
}
.key-arrow__pixel{
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
}
.key-arrow__pixel--up{
  left: 6px; top: 0px;
  box-shadow:
    2px 0 #fff,
    -2px 2px #fff, 0 2px #fff, 2px 2px #fff, 4px 2px #fff,
    -4px 4px #fff, -2px 4px #fff, 0 4px #fff, 2px 4px #fff, 4px 4px #fff, 6px 4px #fff,
    0 6px #fff, 2px 6px #fff,
    0 8px #fff, 2px 8px #fff,
    0 10px #fff, 2px 10px #fff,
    0 12px #fff, 2px 12px #fff,
    0 14px #fff, 2px 14px #fff;
}
.key-arrow__pixel--down{
  left: 6px; top: 0px;
  box-shadow:
    2px 0 #fff,
    0 2px #fff, 2px 2px #fff,
    0 4px #fff, 2px 4px #fff,
    0 6px #fff, 2px 6px #fff,
    0 8px #fff, 2px 8px #fff,
    -4px 10px #fff, -2px 10px #fff, 0 10px #fff, 2px 10px #fff, 4px 10px #fff, 6px 10px #fff,
    -2px 12px #fff, 0 12px #fff, 2px 12px #fff, 4px 12px #fff,
    0 14px #fff, 2px 14px #fff;
}
.key-arrow__pixel--left{
  left: 4px; top: 2px;
  box-shadow:
    -2px 2px #fff, 0 2px #fff,
    -4px 4px #fff, -2px 4px #fff, 0 4px #fff, 2px 4px #fff, 4px 4px #fff, 6px 4px #fff, 8px 4px #fff, 10px 4px #fff,
    -4px 6px #fff, -2px 6px #fff, 0 6px #fff, 2px 6px #fff, 4px 6px #fff, 6px 6px #fff, 8px 6px #fff, 10px 6px #fff,
    -2px 8px #fff, 0 8px #fff,
    0 10px #fff;
}
.key-arrow__pixel--right{
  left: 10px; top: 2px;
  box-shadow:
    0 2px #fff, 2px 2px #fff,
    -10px 4px #fff, -8px 4px #fff, -6px 4px #fff, -4px 4px #fff, -2px 4px #fff, 0 4px #fff, 2px 4px #fff, 4px 4px #fff,
    -10px 6px #fff, -8px 6px #fff, -6px 6px #fff, -4px 6px #fff, -2px 6px #fff, 0 6px #fff, 2px 6px #fff, 4px 6px #fff,
    0 8px #fff, 2px 8px #fff,
    0 10px #fff;
}

  /* Interaction prompt bubble (world-anchored, positioned by JS) */
  #prompt-bubble{
    position:fixed;
    transform:translate(-50%,-100%);
    background:var(--ink);
    color:#fff;
    padding:5px 10px;
    border-radius:6px;
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    white-space:nowrap;
    pointer-events:none;
    display:none;
    z-index:6;
    box-shadow:0 3px 0 rgba(0,0,0,.2);
  }
  #prompt-bubble:after{
    content:'';
    position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--ink);
  }

  /* Modal */
  #modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,22,28,.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:10;
  }
  #modal-overlay.open{ display:flex; }
  #modal-card{
    width:min(520px, 88vw);
    max-height:80vh;
    overflow-y:auto;
    background:var(--parchment);
    border:3px solid var(--ink);
    border-radius:10px;
    padding:22px 24px 20px;
    position:relative;
    box-shadow:0 12px 0 rgba(0,0,0,.2);
    animation:pop-in .18s ease-out;
  }
  #modal-overlay.house-open #modal-card{
    width:min(760px, 92vw);
  }
  @keyframes pop-in{
    from{ transform:scale(.92); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  #modal-icon{
    width:40px; height:40px;
    image-rendering:pixelated;
    float:left;
    margin-right:14px;
    margin-bottom:8px;
  }
  #modal-eyebrow{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    color:var(--accent-dark);
    letter-spacing:.5px;
    margin:0 0 6px;
  }
  #modal-title{
    font-family:'Press Start 2P', monospace;
    font-size:14px;
    color:var(--slate-dark);
    margin:0 0 12px;
    line-height:1.5;
  }
  #modal-period{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--leaf);
    padding:3px 8px;
    border-radius:4px;
    margin-bottom:10px;
  }
  /* Reusable pill style for role names and date ranges inside modal */
  .pill{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--leaf);
    padding:3px 8px;
    border-radius:4px;
    margin-bottom:6px;
  }
  /* Experience layout inside modal */
  .exp{
    margin:10px 0 18px 0;
  }
  .exp-header{
    display:flex;
    flex-wrap:nowrap; /* força uma única linha sem quebras */
    gap:8px 12px;
    align-items:center;
    margin-bottom:8px;
    white-space:nowrap;
    overflow-x:auto; /* permite deslizar horizontalmente se não couber */
    -webkit-overflow-scrolling:touch;
  }
  .exp-header > *{ flex: none; }
  .role.pill{
    background:var(--accent);
    color:#fff;
    font-size:13px;
    padding:6px 10px;
    border-radius:6px;
  }
  .company{
    font-weight:700;
    color:var(--slate-dark);
    font-size:13px;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  .period.pill{
    background:var(--leaf);
    color:#fff;
    font-size:12px;
    padding:4px 8px;
    border-radius:5px;
    white-space:nowrap;
  }
  /* Slightly larger body text for readability */
  #modal-body{ font-size:15px; }
  #modal-body p{ margin:0 0 10px; }
  #modal-body ul{ margin:6px 0 12px 18px; padding:0; }
  #modal-body li{ margin-bottom:6px; }
  #modal-body a{ color:var(--slate-dark); font-weight:700; }
  #modal-body .personal-intro{
    background:linear-gradient(180deg, #fff7e7 0%, #f4ecd8 100%);
    border:2px solid var(--parchment-edge);
    border-radius:10px;
    padding:14px 16px 12px;
    margin-bottom:16px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
  }
  #modal-body .personal-intro__eyebrow{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    letter-spacing:.5px;
    color:var(--accent-dark);
    margin:0 0 8px;
  }
  #modal-body .personal-slider{
    display:grid;
    grid-template-columns:30px minmax(0, 1fr) 30px;
    align-items:center;
    column-gap:10px;
    background:linear-gradient(180deg, #efe5cf 0%, #e8d7b6 100%);
    border:3px solid var(--ink);
    border-radius:12px;
    padding:12px 12px 10px;
    box-shadow:0 8px 0 rgba(0,0,0,.14);
  }
  #modal-body .personal-slider__viewport{
    grid-column:2;
    min-width:0;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  #modal-body .personal-slider__viewport::-webkit-scrollbar{
    display:none;
  }
  #modal-body .personal-card{
    min-width:100%;
    scroll-snap-align:start;
    display:flex;
    justify-content:center;
    padding:0 2px;
  }
  #modal-body .personal-card__frame{
    position:relative;
    width:min(100%, 230px);
    aspect-ratio:4 / 5.15;
    padding:6px;
    overflow:hidden;
    background:#1f2430;
    border:4px solid #f0d9a8;
    box-shadow:
      inset 0 0 0 4px #7b4d2a,
      0 0 0 4px var(--ink),
      6px 6px 0 rgba(43,47,56,.18);
  }
  #modal-body .personal-card__frame::before,
  #modal-body .personal-card__frame::after{
    content:'';
    position:absolute;
    width:10px;
    height:10px;
    background:var(--parchment);
    border:2px solid var(--ink);
  }
  #modal-body .personal-card__frame::before{
    top:-8px;
    left:-8px;
  }
  #modal-body .personal-card__frame::after{
    right:-8px;
    bottom:-8px;
  }
  #modal-body .personal-card__frame--rose{
    box-shadow:
      inset 0 0 0 4px #8f4b61,
      0 0 0 4px var(--ink),
      6px 6px 0 rgba(43,47,56,.18);
  }
  #modal-body .personal-card__frame--amber{
    box-shadow:
      inset 0 0 0 4px #b97f36,
      0 0 0 4px var(--ink),
      6px 6px 0 rgba(43,47,56,.18);
  }
  #modal-body .personal-card__frame--sage{
    box-shadow:
      inset 0 0 0 4px #6f9b5e,
      0 0 0 4px var(--ink),
      6px 6px 0 rgba(43,47,56,.18);
  }
  #modal-body .personal-card__frame img{
    display:block;
    width:100%;
    height:100%;
    aspect-ratio:auto;
    object-fit:cover;
    background:#ddd;
  }
  #modal-body .personal-card__copy{
    padding:12px 6px 0;
  }
  #modal-body .personal-card__copy h3{
    margin:0 0 6px;
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    line-height:1.5;
    color:var(--slate-dark);
  }
  #modal-body .personal-card__copy p{
    margin:0;
    font-size:13px;
    line-height:1.6;
  }
  #modal-body .personal-slider__nav{
    position:static;
    transform:none;
    width:30px;
    height:30px;
    display:grid;
    place-items:center;
    border:2px solid var(--ink);
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  #modal-body .personal-slider__nav:hover{ background:var(--accent-dark); }
  #modal-body .personal-slider__nav--prev{ grid-column:1; }
  #modal-body .personal-slider__nav--next{ grid-column:3; }
  #modal-body .personal-slider__footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:10px;
    padding:0 4px;
    font-size:11px;
  }
  #modal-body .personal-slider__counter{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    color:var(--slate-dark);
  }
  #modal-body .personal-slider__hint{
    color:var(--slate-dark);
    font-size:12px;
  }
  /* Floating sound toggle button (fixed bottom-right) */
  .sound-btn{
    position:fixed;
    right:14px;
    bottom:14px;
    z-index:7;
    background:var(--parchment);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    font-family:'Press Start 2P', monospace;
    font-size:14px;
    pointer-events:auto;
    box-shadow:0 6px 0 rgba(0,0,0,.15);
  }
  #modal-close{
    position:absolute; top:12px; right:12px;
    width:28px; height:28px;
    border:2px solid var(--ink);
    background:#fff;
    border-radius:6px;
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    cursor:pointer;
    line-height:1;
  }
  #modal-close:hover{ background:var(--accent); }

  #footer-note{
    position:fixed; bottom:10px; left:0; right:0;
    text-align:center;
    font-size:10.5px;
    color:var(--slate-dark);
    pointer-events:none;
    z-index:5;
  }
</style>
</head>
<body>

  <div id="sky-layer"></div>

  <script>
    (function(){
      var skyLayer = document.getElementById('sky-layer');
      var CLOUD_IMAGES = ['assets/cloud1.png', 'assets/cloud2.png'];
      var ASPECT = { 'assets/cloud1.png': 56/24, 'assets/cloud2.png': 80/24 };
      var NUM_CLOUDS = 16;
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      for (var i = 0; i < NUM_CLOUDS; i++){
        var img = CLOUD_IMAGES[Math.floor(Math.random() * CLOUD_IMAGES.length)];
        var width = Math.round(90 + Math.random() * 160);
        var height = Math.round(width / ASPECT[img]);
        var topPct = Math.random() * 96;
        var duration = 26 + Math.random() * 50;
        var opacity = (0.55 + Math.random() * 0.45).toFixed(2);

        var el = document.createElement('div');
        el.className = 'sky-cloud';
        el.style.top = topPct + '%';
        el.style.width = width + 'px';
        el.style.height = height + 'px';
        el.style.backgroundImage = "url('" + img + "')";
        el.style.opacity = 'calc(var(--cloud-opacity) * ' + opacity + ')';
        skyLayer.appendChild(el);

        if (reduceMotion){
          el.style.left = (Math.random() * 100) + '%';
          continue;
        }

        var anim = el.animate(
          [
            { transform: 'translateX(calc(100vw + ' + width + 'px))' },
            { transform: 'translateX(-100%)' }
          ],
          { duration: duration * 1000, iterations: Infinity }
        );
        anim.currentTime = Math.random() * duration * 1000;
      }
    })();
  </script>

  <div id="orientation-lock">
    <div id="orientation-lock__icon">📱</div>
    <p>Gire seu aparelho para o modo <b>RETRATO</b><br>pra jogar 🐾</p>
  </div>

  <div id="mobile-joystick">
    <div id="mobile-joystick__knob"></div>
  </div>

  <script>
    (function(){
      var base = document.getElementById('mobile-joystick');
      var knob = document.getElementById('mobile-joystick__knob');
      var radius = 38;
      var deadzone = 10;
      var activeId = null;
      window.mobileInput = { x: 0, y: 0 };

      function setKnob(dx, dy){
        knob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
      }
      function reset(){
        window.mobileInput.x = 0;
        window.mobileInput.y = 0;
        setKnob(0, 0);
      }
      function handleMove(clientX, clientY){
        var rect = base.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var dx = clientX - cx;
        var dy = clientY - cy;
        var dist = Math.hypot(dx, dy);
        if (dist > radius){
          dx = (dx / dist) * radius;
          dy = (dy / dist) * radius;
        }
        setKnob(dx, dy);
        window.mobileInput.x = Math.abs(dx) > deadzone ? Math.sign(dx) : 0;
        window.mobileInput.y = Math.abs(dy) > deadzone ? Math.sign(dy) : 0;
      }

      base.addEventListener('pointerdown', function(e){
        activeId = e.pointerId;
        base.setPointerCapture(activeId);
        handleMove(e.clientX, e.clientY);
      });
      base.addEventListener('pointermove', function(e){
        if (activeId !== e.pointerId) return;
        handleMove(e.clientX, e.clientY);
      });
      function endTouch(e){
        if (activeId !== e.pointerId) return;
        activeId = null;
        reset();
      }
      base.addEventListener('pointerup', endTouch);
      base.addEventListener('pointercancel', endTouch);
      base.addEventListener('pointerleave', function(e){
        if (activeId !== e.pointerId) return;
        endTouch(e);
      });
    })();
  </script>
