<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>João Pedro Sousa — Portfólio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div id="sky-layer"></div>

  <div id="orientation-lock">
    <div id="orientation-lock__icon">📱</div>
    <p>Gire seu aparelho para o modo <b>RETRATO</b><br>pra jogar 🐾</p>
  </div>

  <div id="mobile-joystick">
    <div id="mobile-joystick__knob"></div>
  </div>

  <div id="hud">
    <div class="hud-card hud-help">
      <span class="hud-title">JOÃO PEDRO SOUSA DIZ: </span>
      <span class="key">WASD</span> /
      <span class="key key-arrow" aria-label="Seta para esquerda"><span class="key-arrow__pixel key-arrow__pixel--left" aria-hidden="true"></span></span>
      <span class="key key-arrow" aria-label="Seta para cima"><span class="key-arrow__pixel key-arrow__pixel--up" aria-hidden="true"></span></span>
      <span class="key key-arrow" aria-label="Seta para direita"><span class="key-arrow__pixel key-arrow__pixel--right" aria-hidden="true"></span></span>
      <span class="key key-arrow" aria-label="Seta para baixo"><span class="key-arrow__pixel key-arrow__pixel--down" aria-hidden="true"></span></span>
      para mover &nbsp;
      <br><span class="key">E</span> ou clique para interagir
    </div>
    <div class="hud-card hud-socials">
      <div class="hud-contact">Curtiu meu trabalho? pode me contatar em:</div>
      <a class="social-link" href="https://github.com/jpsousas" target="_blank" rel="noreferrer">
        <img src="assets/github_icon.png" alt="GitHub">
        <span>github.com/jpsousas</span>
      </a>
      <a class="social-link" href="https://www.linkedin.com/in/joão-pedro-b3717924a" target="_blank" rel="noreferrer">
        <img src="assets/linkedin_icon.png" alt="LinkedIn">
        <span>linkedin</span>
      </a>
    </div>
  </div>

  <div id="game-wrap">
    <div id="game-container"></div>
  </div>

  <div id="prompt-bubble">Pressione E</div>

  <div id="modal-overlay">
    <div id="modal-card">
      <button id="modal-close" aria-label="Fechar">✕</button>
      <div id="modal-icon" aria-hidden="true"></div>
      <p id="modal-eyebrow"></p>
      <h2 id="modal-title"></h2>
      <div id="modal-period-wrap"><span id="modal-period"></span></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div>
          <button id="sound-toggle" class="sound-btn" aria-label="Toggle sound">🔊</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
